[project]
name = "realtime-pricing-pipeline"
version = "0.0.1"
description = "Real-time dynamic pricing pipeline — senior DE portfolio project"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".devcontainer", "snowflake/migrations"]

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, B = bugbear, UP = pyupgrade, SIM = simplify
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length handled by black

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["generators", "embedding-matcher", "anomaly-explainer", "dashboard"]
addopts = "-ra"
