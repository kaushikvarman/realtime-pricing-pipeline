name: topics-as-code

  # Validate topics.yaml on every PR and every push to main.
  # Cheap and fast — no broker needed (runs the applier in --dry-run mode).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PyYAML
        run: pip install pyyaml==6.0.1

      - name: Validate topics.yaml (dry-run)
        run: python scripts/create-topics.py --dry-run

      - name: Verify topic count matches expectation
        run: |
          declared=$(python -c "import yaml; print(len(yaml.safe_load(open('topics.yaml'))['topics']))")
          if [ "$declared" -ne 9 ]; then
            echo "Expected 9 topics in topics.yaml, found $declared"
            exit 1
          fi
          echo "✓ 9 topics declared (matches Phase 1 plan)"
